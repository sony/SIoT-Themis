services:
  platform-console:
    container_name: platform-console
    build:
      context: .
      dockerfile: ./platform-console/Dockerfile
      args:
        NEXTAUTH_URL: $PLATFORM_CONSOLE_URL
    image: platform-console:local
    working_dir: /app/platform-console
    tty: true
    volumes:
      - ./keycloak:/setup
    ports:
      - "3000:3000"
    environment:
      POSTGRES_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/themis2?schema=public
      KONG_GATEWAY_ORIGIN: http://kong:8001
      REALTIME_NOTIFICATION_API_ORIGIN: http://kong:8000/realtime-notification-api
      NEXTAUTH_URL: http://localhost:3000
      KEYCLOAK_ENDPOINT: http://keycloak:8080
      ORION_ENDPOINT: http://orion:1026
      CYGNUS_ENDPOINT: http://cygnus:5051
      FIWARE_SERVICE: themis2
    command: ["cp /setup/.env.local.platform /app/platform-console/.env.local && npm run start"]
    depends_on:
      schema:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      keycloak-init:
        condition: service_completed_successfully
      orion:
        condition: service_healthy
      cygnus:
        condition: service_healthy

  mongodb:
    image: mongo:5.0.31
    container_name: mongodb
    hostname: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  schema:
    container_name: schema
    build:
      context: ./schema
      dockerfile: Dockerfile
    image: schema:local
    environment:
      POSTGRES_DATABASE_URL: postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/themis2
      MONGO_DATABASE_URL: mongodb://$CYGNUS_MONGO_USER:$CYGNUS_MONGO_PASS@mongodb:27017/sth_default?authSource=admin
    working_dir: /app/schema
    ports:
      - "5555:5555"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chmod +x ./wait-and-init.sh && ./wait-and-init.sh"]
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  postgres:
    container_name: postgres
    image: postgres:16.3
    volumes:
      - ./postgresql:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_DB: themis2
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER" ]
      interval: 5s
      timeout: 5s
      retries: 5

  data-controller-api-for-documentdb:
    container_name: data-controller-api-for-documentdb
    build:
      context: .
      dockerfile: ./data-controller-api-for-documentdb/Dockerfile
    image: data-controller-api-for-documentdb:local
    working_dir: /app/data-controller-api-for-documentdb
    ports:
      - 4002:3000
    environment:
      POSTGRES_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/themis2
      MONGO_DATABASE_URL: mongodb://${CYGNUS_MONGO_USER}:${CYGNUS_MONGO_PASS}@mongodb:27017/sth_themis2?authSource=admin
    depends_on:
      schema:
        condition: service_completed_successfully
      kong-init:
        condition: service_completed_successfully

  realtime-notification-api-for-documentdb:
    container_name: realtime-notification-api-for-documentdb
    build:
      context: .
      dockerfile: ./realtime-notification-api-for-documentdb/Dockerfile
    image: realtime-notification-api-for-documentdb:local
    working_dir: /app/realtime-notification-api-for-documentdb
    ports:
      - "4003:3000"
    environment:
      POSTGRES_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/themis2
      ORION_URL: http://orion:1026
    depends_on:
      schema:
        condition: service_completed_successfully
      kong-init:
        condition: service_completed_successfully

  orion:
    image: fiware/orion:4.0.0
    ports:
      - "1026:1026"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1026/version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: -dbURI mongodb://orion-mongo
    depends_on:
      orion-mongo:
        condition: service_healthy

  orion-mongo:
    image: mongo:5.0.31
    command: --nojournal
    volumes:
      - orion-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak-init:
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    container_name: keycloak-init
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      - ./keycloak:/setup
    environment:
      KEYCLOAK_ENDPOINT: http://keycloak:8080
      KEYCLOAK_ADMIN: $KEYCLOAK_ADMIN
      KEYCLOAK_ADMIN_PASSWORD: $KEYCLOAK_ADMIN_PASSWORD
      KEYCLOAK_REALM: $KEYCLOAK_REALM
      PLATFORM_CONSOLE_CLIENT_ID: $PLATFORM_CONSOLE_CLIENT_ID
      PLATFORM_CONSOLE_URL: $PLATFORM_CONSOLE_URL
      ELTRES_CONSOLE_CLIENT_ID: $ELTRES_CONSOLE_CLIENT_ID
      ELTRES_CONSOLE_URL: $ELTRES_CONSOLE_URL
      USER_USERNAME: $USER_USERNAME
      USER_EMAIL: $USER_EMAIL
      USER_FIRST_NAME: $USER_FIRST_NAME
      USER_LAST_NAME: $USER_LAST_NAME
      USER_PASSWORD: $USER_PASSWORD

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: keycloak
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: "echo > /dev/tcp/localhost/8080"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      KEYCLOAK_ADMIN: $KEYCLOAK_ADMIN
      KEYCLOAK_ADMIN_PASSWORD: $KEYCLOAK_ADMIN_PASSWORD
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: $POSTGRES_USER
      KC_DB_PASSWORD: $POSTGRES_PASSWORD
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: true
      TZ: Asia/Tokyo
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy

  kong-bootstrap:
    depends_on:
      postgres:
        condition: service_healthy
    image: kong:3.4.2
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres
      KONG_PG_USER: $POSTGRES_USER
      KONG_PG_PASSWORD: $POSTGRES_PASSWORD

  kong:
    depends_on:
      postgres:
        condition: service_healthy
      kong-bootstrap:
        condition: service_completed_successfully
    image: kong:3.4.2
    user: root
    ports:
      - 8000:8000
      - 8001:8001
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres
      KONG_PG_USER: $POSTGRES_USER
      KONG_PG_PASSWORD: $POSTGRES_PASSWORD
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 40s

  kong-init:
    image: kong-init:latest
    build:
      context: ./kong
      dockerfile: Dockerfile
    depends_on:
      kong:
        condition: service_healthy
    environment:
      KONG_ADMIN_ENDPOINT: http://kong:8001
      DATA_CONTROLLER_API_ENDPOINT: http://data-controller-api-for-documentdb:3000
      REALTIME_NOTIFICATION_API_ENDPOINT: http://realtime-notification-api-for-documentdb:3000
      IOT_AGENT_ENDPOINT: http://iot-agent:4041

  cygnus:
    image: fiware/cygnus-ngsi:latest
    container_name: cygnus
    expose:
      - "5080"
    ports:
      - "5051:5051"
      - "5080:5080"
    environment:
      CYGNUS_MONGO_HOSTS: mongodb:27017
      CYGNUS_MONGO_ENABLE_ENCODING: true
      CYGNUS_MONGO_DATA_MODEL: dm-by-service-path
      CYGNUS_MONGO_ATTR_PERSISTENCE: column
      CYGNUS_MONGO_SERVICE_PORT: 5051
      CYGNUS_LOG_LEVEL: DEBUG
      CYGNUS_API_PORT: 5080
      CYGNUS_SERVICE_PORT: 5051
      CYGNUS_MONGO_USER: $CYGNUS_MONGO_USER
      CYGNUS_MONGO_PASS: $CYGNUS_MONGO_PASS
      CYGNUS_MONGO_AUTH_SOURCE: admin
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5080/v1/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  postgres-data:
  mongo-data:
  orion-mongo-data:


networks:
  default:
    name: themis2-app-platform
