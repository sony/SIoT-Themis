name: Setup application env (Real time notification API)

on:
  workflow_call:
    inputs:
      target_env:
        required: true
        type: string

jobs:
  ApplicationBuild:
    name: Application build (Real time notification API)
    permissions:
      id-token: write
      contents: read
      actions: write
    uses: ./.github/workflows/application-build-real-time-notification-api.yml
    with:
      GITHUB_ENV: ${{ inputs.target_env }}
  
  Provision:
    name: Real time notification API Provision
    needs: ApplicationBuild
    permissions:
      id-token: write
      contents: read
      actions: write
    uses: ./.github/workflows/inf-platform-opentofu-applying-self-hosted.yml
    secrets: inherit
    with:
      target_env: ${{ inputs.target_env }}
      module-name: RealtimeNotificationAPI
      target: |
        -target=module.ekspod_infra.kubernetes_manifest.docdb_realtime_notification_api_dply \
        -target=module.ekspod_infra.kubernetes_manifest.docdb_realtime_notification_api_svc
      health-check-command: |
        cd themis2-inf-platform/${{ vars.TOFU_WORK_DIR }}
        EKS_CLUSTER_NAME=$(tofu output eks_cluster_name)
        aws eks update-kubeconfig --name ${EKS_CLUSTER_NAME//\"/}
        kubectl wait --for=condition=Ready pod -l name=docdb-realtime-notification-api,app=app --timeout=300s
      eks-resource-to-restart: deploy/themis2-${{ inputs.target_env }}-docdb-realtime-notification-api
